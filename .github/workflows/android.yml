name: Android tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # Replace this step with your own build/download when testing a real app.
      - run: npm run get:app:android

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOBILE_EMAIL: ${{ secrets.MOBILE_EMAIL }}
          MOBILE_PASSWORD: ${{ secrets.MOBILE_PASSWORD }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: npm run test:android

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
